syntax = "proto3";

package nowis;

option go_package = "protobuf/generated/nowis";

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string displayName = 4;
  string avatarUrl = 5;
  string avatarHash = 6;
  string bio = 7;
  int64 created_at = 8;
  int64 updated_at = 9;
}
