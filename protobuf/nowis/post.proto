syntax = "proto3";

package nowis;

import "user.proto";

option go_package = "protobuf/generated/nowis";

message Post {
  string id = 1;
  string title = 2;
  string slug = 3;
  string content = 4;
  string summary = 5;
  User author = 6;
  repeated string tags = 7;
  string featured_image_url = 8;
  PostStatus status = 9;
  PostVisibility visibility = 10;
  int32 comments_count = 11;
  int32 likes_count = 12;
  int32 read_time_minutes = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
}

enum PostStatus {
  draft = 0;
  published = 1;
  archived = 2;
}

enum PostVisibility {
  public = 0;
  private = 1;
  unlisted = 2;
}